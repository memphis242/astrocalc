[project]
name = "astrocalc-moon"
version = "0.1.0"
description = "Perform various calculations on astronomical objects such as the moon, mars, earth, sun, etc."
readme = "README.md"
requires-python = ">=3.11" # TODO: based on syntax and dependencies, determine actual min Python version
license = { text = "MIT" }
authors = [{ name = "Abdulla Almosalami" }]
keywords = ["moon", "astronomy", "azimuth", "calculation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "skyfield>=1.54",
    "scipy>=1.17.1",
    "click>=8.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "mypy>=1.10",
    "ruff>=0.5",
]

[project.scripts]
astrocalc = "astrocalc.cli:astrocalc"

[project.urls]
Homepage = "https://github.com/abdullah-almosalami/astrocalc"
Issues = "https://github.com/abdullah-almosalami/astrocalc/issues"

[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astrocalc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src/astrocalc"]
